[project]
name = "crosszip"
version = "1.5.1"
description = "Apply a given function to all combinations of elements from multiple iterables"
readme = "README.md"
authors = [
    { name = "Indrajeet Patil", email = "patilindrajeet.science@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["iterables"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pytest>=9.2.0",
]

[project.urls]
Homepage = "https://github.com/IndrajeetPatil/crosszip"
Documentation = "https://www.indrapatil.com/crosszip/"
Repository = "https://github.com/IndrajeetPatil/crosszip"
Issues = "https://github.com/IndrajeetPatil/crosszip/issues"
Changelog = "https://github.com/IndrajeetPatil/crosszip/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
crosszip_parametrize = "crosszip.plugin"

[dependency-groups]
dev = [
    "coverage>=7.17.5",
    "deptry>=0.25.1",
    "mkdocstrings-python>=2.0.11",
    "mutmut>=3.8.1",
    "prek>=0.5.11",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "pytest-codeblocks>=0.18.0",
    "pytest-codspeed==5.0.4",
    "pytest-cov>=7.1.0",
    "pytest-random-order>=1.2.0",
    "pytest-snapshot>=0.9.0",
    "ruff>=0.17.6",
    "ty>=0.0.110",
    "unref>=0.5.1",
    "zensical>=0.1.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
fix = true
preview = true
unsafe-fixes = true

[tool.ruff.lint]
# Keep missing-trailing-comma enabled to preserve intentional multiline layouts.
# `make format` applies its fixes before the formatter can collapse those lines.
select = ["ALL"]
ignore = [
    # Mutually exclusive with D211 and D212, respectively.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # This project uses a repository-level LICENSE instead of per-file notices.
    "CPY",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # docstring requirements
    "D",
    # tests can have asserts
    "assert",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["crosszip"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.pytest]
# Strict mode enables strict_config, strict_markers, strict_parametrization_ids,
# and strict_xfail, plus any strictness options future pytest releases add. uv.lock
# pins pytest, so new options only arrive through a reviewed dependency update.
strict = true
minversion = "9.2"
strict_config = true
strict_markers = true
strict_parametrization_ids = true
xfail_strict = true
empty_parameter_set_mark = "fail_at_collect"
collect_imported_tests = false
required_plugins = [
    "pytest-random-order",
    "pytest-cov",
    "pytest_codeblocks",
    "pytest-codspeed",
    "pytest-snapshot",
]
addopts = [
    # show extra test summary info for everything
    "-ra",
    # include more verbose output
    "--verbose",
    # using pytest-random-order plugin option
    "--random-order",
    # isolate test discovery and execution without altering sys.path
    "--import-mode=importlib",
]
testpaths = ["tests"]
filterwarnings = ["error"]
python_files = ["test_*.py", "test-*.py", "tests.py", "test.py"]

[tool.coverage.run]
branch = true
source = ["crosszip"]

[tool.coverage.report]
fail_under = 100
precision = 2
format = "markdown"
sort = "-Cover"
show_missing = true
skip_empty = true

[tool.mutmut]
source_paths = ["src/crosszip/"]
# tests/test_readme.py runs the examples in README.md.
also_copy = ["README.md"]
pytest_add_cli_args_test_selection = ["tests/"]
# Only mutate lines exercised by the test suite so mutmut concentrates on
# meaningful mutations that the tests should actually catch.
mutate_only_covered_lines = true
# typing.cast returns its value unchanged: mutating its type argument to None or
# another string is equivalent at runtime. Keep the following join mutation-tested.
do_not_mutate_patterns = ['^\s*validated_names = cast\("tuple\[str, \.\.\.\]", param_names\)$']

[tool.ty.src]
exclude = [".venv", "build", "dist", "docs"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Enable every current diagnostic, including soundness and suppression checks that
# ty leaves disabled by default. Pinning ty in uv.lock keeps new rules from arriving
# silently between dependency updates.
all = "error"

[tool.ty.analysis]
# Prefer sound narrowing over convenience assumptions at external-data boundaries.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.uv]
required-version = ">=0.13.0"

[tool.unref]
show-transitive = true

[tool.deptry]
known_first_party = ["crosszip"]
