[project]
name = "crosszip"
version = "1.4.1"
description = "Apply a given function to all combinations of elements from multiple iterables"
readme = "README.md"
authors = [
    { name = "Indrajeet Patil", email = "patilindrajeet.science@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["iterables"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/IndrajeetPatil/crosszip"
Documentation = "https://www.indrapatil.com/crosszip/"
Repository = "https://github.com/IndrajeetPatil/crosszip"
Issues = "https://github.com/IndrajeetPatil/crosszip/issues"
Changelog = "https://github.com/IndrajeetPatil/crosszip/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
crosszip_parametrize = "crosszip.plugin"

[dependency-groups]
dev = [
    "add-trailing-comma>=4.0.0",
    "coverage>=7.16.1",
    "jupyter>=1.1.1",
    "mkdocstrings-python>=2.0.8",
    "mutmut>=3.8.0",
    "prek>=0.5.3",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-codspeed==5.0.3",
    "pytest-cov>=7.1.0",
    "pytest-random-order>=1.2.0",
    "pytest-snapshot>=0.9.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
    "ty>=0.0.82",
    "zensical>=0.0.63",
]

[build-system]
requires = ["uv_build>=0.12.1"]
build-backend = "uv_build"

[tool.ruff]
fix = true
preview = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Required for compatibility with Ruff's formatter.
    "missing-trailing-comma",
    # Mutually exclusive with D211 and D212, respectively.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # This project uses a repository-level LICENSE instead of per-file notices.
    "CPY",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # docstring requirements
    "D",
    # tests can have asserts
    "assert",
]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.pytest.ini_options]
addopts = [
    # error on problems parsing pytest configuration
    "--strict-config",
    # error on using unregistered marker
    "--strict-markers",
    # show extra test summary info for everything
    "-ra",
    # include more verbose output
    "--verbose",
    # using pytest-random-order plugin option
    "--random-order",
]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
python_files = ["test_*.py", "test-*.py", "tests.py", "test.py"]

[tool.coverage.run]
branch = true
source = ["crosszip"]

[tool.coverage.report]
fail_under = 100
format = "markdown"
sort = "-Cover"
show_missing = true
skip_empty = true

[tool.mutmut]
source_paths = ["src/crosszip/"]
# The regression-gate tests import the comparator from this support package.
also_copy = ["scripts/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Only mutate lines exercised by the test suite so mutmut concentrates on
# meaningful mutations that the tests should actually catch.
mutate_only_covered_lines = true
# typing.cast returns its value unchanged: mutating its type argument to None or
# another string is equivalent at runtime. Keep the following join mutation-tested.
do_not_mutate_patterns = ['^\s*validated_names = cast\("tuple\[str, \.\.\.\]", param_names\)$']

[tool.ty.src]
exclude = [".venv", "build", "dist", "docs"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# Enable every current diagnostic, including soundness and suppression checks that
# ty leaves disabled by default. Pinning ty in uv.lock keeps new rules from arriving
# silently between dependency updates.
all = "error"

[tool.ty.analysis]
# Prefer sound narrowing over convenience assumptions at external-data boundaries.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.uv]
required-version = ">=0.12.0"
